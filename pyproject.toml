[project]
name = "fidetype"
# Version source of truth: __version__ in src/fidetype/__init__.py (see [tool.hatch.version]).
# README: built from README.md with relative links made absolute (see [tool.hatch.metadata.hooks.fancy-pypi-readme]).
dynamic = ["version", "readme"]
description = "An open trust layer for neural text entry: calibrated, abstaining, hallucination-aware BCI text decoding."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Zibo Zhang" }]
keywords = [
    "brain-computer-interface",
    "bci",
    "meg",
    "eeg",
    "emg",
    "neural-decoding",
    "text-entry",
    "calibration",
    "conformal-prediction",
    "hallucination-detection",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["numpy"]

[project.optional-dependencies]
# dev includes [ws], [emg2qwerty] and [sign], so CI runs the WebSocket, HDF5 and signed-anchor tests (they skip
# cleanly when the package is missing).
dev = ["pytest", "fidetype[ws,emg2qwerty,sign]"]
data = ["mne>=1.8", "scipy>=1.13"]
# Lab Streaming Layer adapter (fidetype.adapters.lsl). pylsl is MIT; its Windows wheel includes liblsl.
lsl = ["pylsl>=1.16"]
# BrainFlow -> LSL bridge (fidetype.adapters.brainflow_bridge; also needs [lsl]). brainflow is MIT.
brainflow = ["brainflow>=5.10"]
# WebSocket adapter (fidetype.adapters.ws, FEP-0004). websockets is BSD-3-Clause; pinned (sync API).
ws = ["websockets==17.4"]
# emg2qwerty replay adapter (fidetype.adapters.emg2qwerty): reads the HDF5 sessions. h5py is BSD-3-Clause.
emg2qwerty = ["h5py>=3.10"]
# Local LLM rescoring / rewrite (fidetype.lm.llm.LlamaCppLLM, P15-05). llama-cpp-python is MIT. On Windows use the
# prebuilt CPU wheel: uv pip install llama-cpp-python --only-binary llama-cpp-python
#   --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu --index-strategy unsafe-best-match
llm = ["llama-cpp-python>=0.3.36"]
# Signed ledger anchors (fidetype.trust.provenance sign_anchor / verify_anchor, P5-14): Ed25519.
# cryptography is Apache-2.0 OR BSD-3-Clause.
sign = ["cryptography>=43"]

[project.scripts]
fidetype = "fidetype.cli:main"
# Same as `fidetype collector` (FEP-0006).
fidetype-collector = "fidetype.collector.__main__:main"
# P7-01: the conformance kit runner (spec/conformance/kit/, docs/conformance.md).
nts-conform = "fidetype.conformance.nts_conform:main"

[project.urls]
Homepage = "https://github.com/zhangzibo/fidetype"
Repository = "https://github.com/zhangzibo/fidetype"
Issues = "https://github.com/zhangzibo/fidetype/issues"
Specification = "https://github.com/zhangzibo/fidetype/tree/main/spec"
Changelog = "https://github.com/zhangzibo/fidetype/blob/main/CHANGELOG.md"
Releasing = "https://github.com/zhangzibo/fidetype/blob/main/docs/RELEASING.md"

[build-system]
# hatch-fancy-pypi-readme is MIT. It only rewrites README links for the PyPI page.
requires = ["hatchling>=1.26", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/fidetype/__init__.py"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# Relative links (wiki/, spec/, LICENSE, ...) do not work on PyPI. Point them at GitHub.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)]+)\)'
replacement = '](https://github.com/zhangzibo/fidetype/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/fidetype"]
# Never ship caches or local data in the wheel.
exclude = ["__pycache__", "*.pyc", "*.pt", "*.ckpt", "*.npy", "*.fif", "*.edf", "*.mat", "*.h5"]

# The golden conformance vectors (small synthetic fixtures, about 1.5 MB) go into the wheel, so that
# `fidetype conformance --profile <name>` works without a checkout.
[tool.hatch.build.targets.wheel.force-include]
"spec/conformance" = "fidetype/_spec/conformance"

# The sdist holds the package, its tests, examples and the spec; not the research files.
# Leading "/" anchors each pattern at the repository root (unanchored "examples" also matched
# sdk/rust/target/*/examples).
[tool.hatch.build.targets.sdist]
include = ["/src/fidetype", "/tests", "/examples/*.py", "/examples/collector/*.toml", "/examples/collector/*.json",
           "/examples/ws-browser", "/spec", "/README.md", "/LICENSE", "/CHANGELOG.md", "/CITATION.cff"]
exclude = ["__pycache__", "*.pyc", "/examples/collector/out"]

[tool.pytest.ini_options]
testpaths = ["tests"]
