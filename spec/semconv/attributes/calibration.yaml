# NTS semantic conventions: namespace calibration (spec 3.4). See ../manifest.yaml.
container: header.meta
namespace: calibration
brief: Calibration steps after the decoder.
attributes:
  - key: calibration.applied
    type: boolean
    validator: boolean
    default: false
    brief: >-
      true if a calibration step changed the probabilities after the decoder. A producer
      MUST NOT set true unless a calibration step ran.
    stability: development
    target_stability: stable
    rules: [MET-1, MET-6]
    checks: [NTS-META-TYPES, TR-CALIB]
