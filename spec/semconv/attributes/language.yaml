# NTS semantic conventions: the flat key language (spec 3.4). See ../manifest.yaml.
container: header.meta
namespace: language
brief: The language of the decoded text.
attributes:
  - key: language
    type: string
    validator: bcp47_tag
    brief: The BCP 47 tag of the decoded text.
    requirement:
      - {scope: trust-ready, level: conditionally_required, condition: "vocab_type is char, word or phoneme", checks: [TR-LANGUAGE]}
    stability: development
    target_stability: stable
    rules: [MET-1]
    checks: [NTS-META-TYPES]
    related_fields: [neuraltextstream.v1.Header.vocab_type]
