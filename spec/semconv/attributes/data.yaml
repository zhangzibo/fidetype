# NTS semantic conventions: namespace data (spec 3.4). See ../manifest.yaml.
container: header.meta
namespace: data
brief: The kind of data in the stream.
attributes:
  - key: data.derived
    type: boolean
    validator: boolean
    brief: true if the stream holds only data derived from neural signals, no raw samples. SHOULD be true.
    requirement:
      - {scope: trust-ready, level: required, condition: "the value is true", checks: [TR-DERIVED]}
    stability: development
    target_stability: stable
    rules: [MET-1]
    checks: [NTS-META-TYPES]
