# NTS semantic conventions: namespace device (spec 3.4). See ../manifest.yaml.
container: header.meta
namespace: device
brief: The recording device.
attributes:
  - key: device.modality
    type: enum
    values: [emg, eeg, meg, opm-meg, ecog, intracortical, fnirs, other]
    unknown_value: other
    validator: enum
    brief: The signal modality of the recording device.
    requirement:
      - {scope: trust-ready, level: required, checks: [TR-MODALITY]}
    stability: development
    target_stability: stable
    rules: [MET-1, VER-8]
    checks: [NTS-META-TYPES]
    spec_registry_row: "`device.modality`"
  - key: device.vendor
    type: string
    validator: non_empty_string
    brief: The maker of the recording device.
    stability: development
    target_stability: stable
    rules: [MET-1]
    checks: [NTS-META-TYPES]
  - key: device.model
    type: string
    validator: non_empty_string
    brief: The model of the recording device.
    stability: development
    target_stability: stable
    rules: [MET-1]
    checks: [NTS-META-TYPES]
  - key: device.channel_count
    type: int
    validator: integer_min_1
    brief: The number of input channels that the decoder used (integer >= 1).
    stability: development
    target_stability: stable
    rules: [MET-1]
    checks: [NTS-META-TYPES]
  - key: device.invasive
    type: boolean
    validator: boolean
    brief: true for implanted electrodes.
    stability: development
    target_stability: stable
    rules: [MET-1]
    checks: [NTS-META-TYPES]
  - key: device.regulatory_status
    type: string
    validator: non_empty_string
    examples: [research, investigational, cleared, consumer, unknown]
    brief: The regulatory status of the device. Information only, not a claim of approval.
    stability: development
    target_stability: stable
    rules: [MET-1]
    checks: [NTS-META-TYPES]
