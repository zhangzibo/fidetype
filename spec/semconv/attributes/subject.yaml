# NTS semantic conventions: namespace subject (spec 3.4). See ../manifest.yaml.
container: header.meta
namespace: subject
brief: The person who was recorded (pseudonymous).
attributes:
  - key: subject.id
    type: string
    validator: non_empty_string
    brief: A pseudonymous subject id (10.3). The mapping to real people MUST NOT be in the stream.
    stability: development
    target_stability: stable
    rules: [MET-1, SEC-4]
    checks: [NTS-META-TYPES, PV-PSEUDONYM]
