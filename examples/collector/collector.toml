# Fidetype collector v0.1 example (FEP-0006). Run from the repository root:
#
#   fidetype collector --config examples/collector/collector.toml
#   fidetype collector --config examples/collector/collector.toml --check   # check only
#
# Relative paths resolve against the folder of this file.
# trust-example.json is a TOY trust configuration (not calibrated on any data). It only shows the
# wiring. Fit a real one with fidetype.calibrate(...) and FrozenTrustConfig.save(...).
# The input is a synthetic conformance vector (no participant data).
# Formats: TOML or JSON only. YAML is not supported (it would need a new dependency).
# Every decision gets spec_version "1.0". The trust processor adds the commit gate
# (min_chars = 1, no blank COMMIT, TD-9) when the trust configuration has none; the log says so.

[service]
log = "info"                                   # "info" (stderr) or "quiet"
metrics_file = "out/metrics.json"              # written at stop
# GET /healthz and /metrics (JSON). Default listen: 127.0.0.1:13133 (localhost only).
# [service.health]
# listen = "127.0.0.1:13133"
# token_env = "FIDETYPE_HEALTH_TOKEN"          # optional bearer token (Authorization: Bearer <token>)
# A listen address beyond localhost needs token_env, or allow_unauthenticated = true (then a warning).

[receivers.replay]
type = "file"
paths = ["../../spec/conformance/fep-0001/f01-segments.jsonl"]
eof = "close"                                  # "close" (like `fidetype trust`; a file without an end
                                               # event gives one warning and counts closed_without_end) or "cut"
# follow = true                                # tail mode; idle_timeout_s = 10 cuts an open stream

# A live WebSocket input (FEP-0004 /nts) and its /decisions channel. Needs the [ws] extra.
# [receivers.live]
# type = "websocket"
# listen = "127.0.0.1:8765"
# token_env = "FIDETYPE_WS_TOKEN"              # the token comes from this environment variable

[processors.check]
type = "validate"                              # conformance checks; an invalid event cuts the utterance
on_invalid = "cut"

[processors.trust]
type = "trust"
config = "trust-example.json"
decoder = "greedy"                             # none (hypothesis route), greedy or demo
max_attempts = 2
# ledger = { path = "out/ledger.jsonl", text_mode = "hash" }   # hash-chained provenance (PRV-1)
# Signed anchors written by the collector (P5-16; needs the [sign] extra). The key comes from an environment
# variable (PEM text) or a key file, never from this file:
# ledger = { path = "out/ledger.jsonl", text_mode = "hash", anchor = { dir = "out/anchors",
#            key_env = "FIDETYPE_ANCHOR_KEY", every_n = 100, every_s = 60 } }
# Check: python -m fidetype.trust.provenance verify out/ledger.jsonl --anchor out/anchors --allow-growth
#        --public-key anchor.pub.pem

[processors.thin]
type = "thin"
keep_provisional = "changes"                   # drop provisional decisions that repeat the last one

[processors.privacy]
type = "redact"                                # SEC-7: no decoded text in the log
mode = "drop"                                  # or "hmac" with key_env = "FIDETYPE_REDACT_KEY"

[exporters.log]
type = "jsonl"
path = "out/decisions.jsonl"                   # a decision log (spec 6.4)

[exporters.console]
type = "stdout"
# P5-18: a product exporter can drop research-only decisions (input.research_only = true, FEP-0010) and, by
# default, decisions with an unknown licence (no input.research_only). Works on every exporter type. On an exporter
# of input events (P5-22) it drops each research-only or unknown-licence stream whole, by its header.
# refuse_research_only = true
# unknown_licence = "refuse"                   # or "pass"

# The input events too (an NTS stream file). {session} gives one file per stream (P5-17): a file of input
# events without {session} is refused when the pipeline can carry more than one stream (several receivers or
# files, a websocket or LSL receiver).
# [exporters.streams]
# type = "jsonl"
# path = "out/streams/{session}.nts.jsonl"
# types = ["header", "frame", "segment_end", "end"]

# [exporters.live_decisions]
# type = "websocket"
# receiver = "live"                            # serves /decisions on the receiver's server

# A standalone /decisions server for a file replay demo (no websocket receiver). Needs the [ws] extra.
# Subscribe: fidetype ws subscribe ws://127.0.0.1:8766/decisions --from-seq 1
# [exporters.demo_decisions]
# type = "websocket"                           # no "receiver": the exporter starts its own server
# listen = "127.0.0.1:8766"                    # /decisions only; /nts and /events give 404
# linger_s = 60                                # keep serving 60 s after the input is done
# token_env = "FIDETYPE_WS_TOKEN"              # optional; needed beyond localhost

[pipelines.main]
receivers = ["replay"]
processors = ["check", "trust", "thin", "privacy"]
exporters = ["log", "console"]               # add "demo_decisions" to serve /decisions
# With two or more receivers in one pipeline, each stream id becomes "<receiver>/<stream id>"
# (for example "replay/replay-0"); it is the session of its decisions.
