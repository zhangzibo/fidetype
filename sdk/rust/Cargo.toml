[package]
name = "fidetype"
version = "0.1.0"
edition = "2021"
# Oldest Rust that builds the crate (lib, bin, no_std core). CI checks it (job rust-msrv).
rust-version = "1.81"
license = "Apache-2.0"
authors = ["Zibo Zhang"]
description = "Open-source toolkit for brain and body-signal typing: Rust SDK for the NeuralTextStream (NTS) format (no_std + alloc core)"
repository = "https://github.com/zhangzibo/fidetype"
homepage = "https://github.com/zhangzibo/fidetype"
documentation = "https://docs.rs/fidetype"
readme = "README.md"
keywords = ["bci", "emg", "eeg", "nts", "no-std"]
categories = ["no-std", "parser-implementations", "science::neuroscience"]
# Only the sources and the docs go into the .crate file. Tests and examples read the golden
# vectors in ../../spec/conformance, which are not part of the crate.
include = ["/src/**/*.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/CHANGELOG.md", "/LICENSE"]
# Publishing to crates.io is a maintainer decision: see docs/RELEASING.md.

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[features]
default = ["std"]
# File and stream I/O, the CLI and the example. The core (parse, check, write, decide) needs only `alloc`.
std = []

[dependencies]
# Portable math (exp, log) for the no_std core; the same results on every platform.
libm = { version = "=0.2.15", default-features = false }

[[bin]]
name = "fidetype-rs"
path = "src/bin/fidetype-rs.rs"
required-features = ["std"]

[[example]]
name = "validate_replay"
required-features = ["std"]

[profile.release]
lto = true
codegen-units = 1
