# Release workflow for the Fidetype SDKs (PyPI, npm, crates.io).
#
# It NEVER runs by itself: the only trigger is workflow_dispatch (a maintainer clicks "Run workflow"
# in the Actions tab). It has no push, tag, schedule or pull_request trigger.
# With target "dry-run" it only builds and checks the package. A publish needs:
#   1. the one-time registry setup (docs/RELEASING.md section 3: trusted publishers),
#   2. the protected environments release-pypi, release-npm, release-crates (required reviewer),
#   3. an existing tag py-vX.Y.Z, ts-vX.Y.Z or rs-vX.Y.Z whose version equals the package version.
# Without the trusted-publisher setup, every upload step fails; nothing is published.
# Step-by-step guide: docs/publishing-checklist.md.
name: release

on:
  workflow_dispatch:
    inputs:
      sdk:
        description: "SDK to release"
        required: true
        type: choice
        options: [python, typescript, rust]
      tag:
        description: "Existing tag to release (py-vX.Y.Z, ts-vX.Y.Z or rs-vX.Y.Z)"
        required: true
        type: string
      target:
        description: "python: testpypi | pypi. typescript / rust: dry-run | publish"
        required: true
        type: choice
        options: [dry-run, testpypi, pypi, publish]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- Python
  python-build:
    if: inputs.sdk == 'python'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: Tag version = package version
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('src/fidetype/__init__.py').read())[1])")
          test "py-v$v" = "${{ inputs.tag }}" || { echo "tag ${{ inputs.tag }} != py-v$v"; exit 1; }
      - run: uvx --from build pyproject-build --installer uv --outdir dist .
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

  python-publish:
    needs: python-build
    if: inputs.sdk == 'python' && (inputs.target == 'testpypi' || inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: release-pypi
    permissions:
      id-token: write   # PyPI trusted publishing (OIDC) + attestations
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          attestations: true

  # ------------------------------------------------------------ TypeScript
  typescript:
    if: inputs.sdk == 'typescript'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'publish' && 'release-npm' || '' }}
    permissions:
      contents: read
      id-token: write   # npm provenance / trusted publishing
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Tag version = package version
        run: |
          v=$(node -p "require('./package.json').version")
          test "ts-v$v" = "${{ inputs.tag }}" || { echo "tag ${{ inputs.tag }} != ts-v$v"; exit 1; }
      - run: npm ci --no-audit --no-fund
      - run: npm run ci
      - run: npm pack --dry-run
      - name: Publish
        if: inputs.target == 'publish'
        # With an npm trusted publisher, no token is needed. Without one, add the secret NPM_TOKEN
        # to the release-npm environment.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

  # ------------------------------------------------------------------ Rust
  rust:
    if: inputs.sdk == 'rust'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'publish' && 'release-crates' || '' }}
    permissions:
      contents: read
      id-token: write   # crates.io trusted publishing
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Tag version = crate version
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys;print(json.load(sys.stdin)['packages'][0]['version'])")
          test "rs-v$v" = "${{ inputs.tag }}" || { echo "tag ${{ inputs.tag }} != rs-v$v"; exit 1; }
      - run: cargo test --locked
      - run: cargo package --list --locked
      - run: cargo publish --dry-run --locked
      - name: crates.io token through OIDC
        if: inputs.target == 'publish'
        id: auth
        # The first upload of a crate cannot use OIDC (crates.io needs the crate to exist before a
        # trusted publisher can be added). Then this step fails and the secret CRATES_IO_TOKEN in the
        # release-crates environment is used instead. Delete that secret after the first upload.
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        if: inputs.target == 'publish'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CRATES_IO_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "no crates.io token: add a trusted publisher or the CRATES_IO_TOKEN secret"; exit 1; }
          cargo publish --locked
