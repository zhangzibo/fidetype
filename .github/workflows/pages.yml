# Deploys the static site (node tools/site/build.js) to GitHub Pages.
#
# It NEVER runs by itself: the only trigger is workflow_dispatch (a maintainer clicks "Run workflow"
# in the Actions tab). It has no push, schedule or pull_request trigger.
# Before the first run, turn on Pages: Settings -> Pages -> Source: "GitHub Actions".
# Until then, the deploy job fails and nothing is published.
# Step-by-step guide: docs/publishing-checklist.md.
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      # Builds _site/ and checks every local link (exit 1 on a broken link).
      - run: node tools/site/build.js --out _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
