# Deploys the static site (node tools/site/build.js) to GitHub Pages.
#
# It runs on every push to main (the maintainer decided on 2026-11-21 that the site deploys
# automatically), and by hand with "Run workflow" in the Actions tab. It has no pull_request or
# schedule trigger, so a fork or a PR can never deploy. Packages (release.yml) stay manual-only.
# A newer push cancels a deploy that has not finished, so only the newest main is published.
# The build checks every local link; a broken link fails the build and nothing is deployed.
# Pages must be on: Settings -> Pages -> Source: "GitHub Actions".
# Step-by-step guide: docs/publishing-checklist.md.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      # Builds _site/ and checks every local link (exit 1 on a broken link).
      - run: node tools/site/build.js --out _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
