# Run the test suite on every push to main and on every pull request.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: the job only checks out code and runs tests.
permissions:
  contents: read

jobs:
  # P2-09: the full Python suite on every supported Python (Linux) and on Windows and macOS.
  # 3.15 is not in the matrix: h5py (dev extra) has no cp315 wheel yet (gap 62). macOS runs one Python (3.13) only:
  # macOS runners are scarce, and with 3.12 and 3.13 the macOS jobs of busy days queued for 20 min and were cancelled.
  # fail-fast is off, so one red platform does not hide the others.
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - { os: windows-latest, python: "3.12" }
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    env:
      # macOS runners have larger scheduler jitter: wall-clock test bounds (LSL reconnect stall, collector latency
      # budget) are multiplied by 4 there. Linux and Windows keep the plain bounds.
      FIDETYPE_LATENCY_TOLERANCE: ${{ matrix.os == 'macos-latest' && '4' || '1' }}
    steps:
      - uses: actions/checkout@v7

      # Install uv and the matrix Python; cache uv downloads between runs.
      - uses: astral-sh/setup-uv@v10.3.3  # no floating major tag exists after v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      # Dev extra only: the "data" extra (mne, scipy) is not needed, and CI has no MEG data.
      - run: uv sync --extra dev

      - run: uv run pytest -q

  # P2-09: the conformance suites of the three SDKs (Python, TypeScript, Rust) and the Python wheel smoke test
  # on Windows and macOS. Linux runs the same steps in the packaging, typescript and rust jobs.
  conformance-os:
    name: conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Python wheel in a clean venv; conformance suite and kit
        run: |
          set -eo pipefail
          uvx --from build pyproject-build --installer uv --outdir "$RUNNER_TEMP/pydist" .
          uv venv "$RUNNER_TEMP/v"
          if [ "$RUNNER_OS" = "Windows" ]; then b="$RUNNER_TEMP/v/Scripts"; else b="$RUNNER_TEMP/v/bin"; fi
          uv pip install --python "$RUNNER_TEMP/v" "$RUNNER_TEMP"/pydist/*.whl
          cd "$RUNNER_TEMP"
          "$b/fidetype" version
          "$b/fidetype" conformance --profile fep-0001
          "$b/fidetype" conformance consumer
          "$b/nts-conform" kit --require-level trust-ready
          "$b/nts-conform" certified --check
          "$b/fidetype-collector" --help
      - uses: actions/setup-node@v6
        if: ${{ !cancelled() }}
        with:
          node-version: "24"
      - name: TypeScript SDK (build, tests, golden vectors, conformance kit)
        if: ${{ !cancelled() }}  # run each SDK even when an earlier SDK step failed
        working-directory: sdk/typescript
        run: |
          npm ci --no-audit --no-fund
          npm run ci
      - name: Rust SDK (tests, golden vectors, conformance kit)
        if: ${{ !cancelled() }}  # run each SDK even when an earlier SDK step failed
        working-directory: sdk/rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo test --locked
          cargo run --locked --release --bin fidetype-rs -- conformance
          cargo run --locked --release --bin fidetype-rs -- conformance --vectors ../../spec/conformance/kit

  # P14-04 / P4-02: `fidetype live` end to end on the real BrainFlow Synthetic board and a real pylsl loopback
  # (synthetic recording). Only tests/test_live.py runs here, so other LSL tests stay out of this job.
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra lsl --extra brainflow
      - run: uv run python -c "import pylsl, brainflow; print('pylsl', pylsl.library_version())"
      - run: uv run pytest -q tests/test_live.py tests/test_live_reconnect.py tests/test_live_onset.py -rs
      # P7-06: our own LSL outlets and WebSocket producer / decisions channel, recorded on loopback with
      # nts-conform capture; the captures and their received streams must reach NTS Trust-ready with the binding.
      - name: Binding producer captures (P7-06)
        run: |
          set -o pipefail
          uv run pytest -q tests/test_conformance_capture.py -rs
          uv run python -m fidetype.conformance.binding_producers --out "$RUNNER_TEMP/p7-06"
          uv run nts-conform check "$RUNNER_TEMP/p7-06/lsl" --require-level trust-ready | tee "$RUNNER_TEMP/lsl.txt"
          uv run nts-conform check "$RUNNER_TEMP/p7-06/ws" --require-level trust-ready | tee "$RUNNER_TEMP/ws.txt"
          grep -q "bindings nts-lsl/0.1" "$RUNNER_TEMP/lsl.txt"
          grep -q "bindings nts-ws/0.1" "$RUNNER_TEMP/ws.txt"
      # P14-16: `fidetype live --publish` (lsl:NAME; ws://.../nts + ws://.../decisions), recorded the same way.
      - name: fidetype live publish captures (P14-16)
        run: |
          set -o pipefail
          uv run pytest -q tests/test_live_publish.py -rs
          uv run python -m fidetype.conformance.binding_producers --out "$RUNNER_TEMP/p14-16" --target live-lsl --target live-ws
          uv run nts-conform check "$RUNNER_TEMP/p14-16/live-lsl" --require-level trust-ready | tee "$RUNNER_TEMP/live-lsl.txt"
          uv run nts-conform check "$RUNNER_TEMP/p14-16/live-ws" --require-level trust-ready | tee "$RUNNER_TEMP/live-ws.txt"
          grep -q "bindings nts-lsl/0.1" "$RUNNER_TEMP/live-lsl.txt"
          grep -q "bindings nts-ws/0.1" "$RUNNER_TEMP/live-ws.txt"

  # P14-11: replay a public EMG recording over a pylsl loopback through `fidetype live` (markers and detect timing)
  # and validate the NTS output. Data: KT-sEMG run3, copyright 2021 Nokia, CC BY 4.0 (doi:10.7910/DVN/AV6XIR);
  # downloaded at run time, SHA-256 pinned in tools/ci/kt-semg-run3.sha256, cached, never committed.
  live-kt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra lsl
      - uses: actions/cache@v6
        with:
          path: ~/.cache/fidetype-ci/kt-semg
          key: kt-semg-run3-${{ hashFiles('tools/ci/kt-semg-run3.sha256') }}
      - run: uv run python tools/ci/kt_lsl_replay.py --cache ~/.cache/fidetype-ci/kt-semg --work ${{ runner.temp }}/kt

  # P1-02: the proto files (spec/proto) are the source of truth. protoc must accept them, the
  # generated JSON Schema must be up to date, and the schema must give the SDK verdict on every
  # vector that fails or passes on schema grounds (with our validator and with the jsonschema library).
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Generated JSON Schema is up to date
        run: uv run --no-project python tools/proto/gen_jsonschema.py --check
      - name: protoc compiles the proto files and agrees with the generator's parser
        run: uvx --from grpcio-tools==1.85.1 python tools/proto/check_protoc.py
      - name: Schema parity with the SDK verdicts (built-in validator)
        run: uv run --no-project python tools/proto/parity.py
      - name: Schema parity with the SDK verdicts (jsonschema library)
        run: uv run --no-project --with jsonschema==4.26.0 python tools/proto/parity.py --engine jsonschema

  # P1-04: the semantic-convention registry (spec/semconv/*.yaml) must agree with the spec tables,
  # the proto files, the generated JSON Schema, the three SDK validators and the conformance vectors,
  # and the generated page spec/semconv/registry.md must be up to date.
  semconv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Registry agrees with spec, proto, schema, SDKs, vectors; registry.md up to date
        run: uv run --no-project --with pyyaml==6.0.3 python tools/semconv/semconv.py --check
      - name: Tests of the generator and the check
        run: uv run --no-project --with pyyaml==6.0.3 --with pytest python -m pytest -q -p no:cacheprovider tests/test_semconv.py

  # TypeScript SDK (sdk/typescript, M7-06): build, schema drift check, browser-safety check,
  # unit tests and the golden vectors, on the oldest and the newest supported Node.
  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "24"]
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6  # v6 runs on node24; v4 used the deprecated node20 runtime
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - run: npm run ci

  # The TypeScript and the Python reference consumers must give the same verdict on every golden vector.
  typescript-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - uses: actions/setup-node@v6  # v6 runs on node24; v4 used the deprecated node20 runtime
        with:
          node-version: "24"
      - working-directory: sdk/typescript
        run: |
          npm ci --no-audit --no-fund
          npm run build
          FIDETYPE_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python" npm run cross-check
          # P7-01: the same verdicts on the conformance kit
          FIDETYPE_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python" node scripts/cross-check.mjs --vectors ../../spec/conformance/kit
          # M7-11: --n 30 at 3 seeds (about 12,000 mutants); --n 10 at one seed missed 4 TypeScript gaps.
          for s in 1 2 3; do FIDETYPE_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python" node scripts/fuzz-parity.mjs --n 30 --seed $s || exit 1; done

  # Rust SDK (sdk/rust, M7-07): unit + integration tests and the golden vectors, the no_std core
  # on a bare-metal target (Cortex-M4F/M7), and the CLI conformance run. Stable toolchain.
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - uses: actions/checkout@v7
      - name: Rust stable (minimal profile) + thumbv7em-none-eabihf
        run: |
          rustup toolchain install stable --profile minimal --target thumbv7em-none-eabihf
          rustup default stable
          rustc --version
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sdk/rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('sdk/rust/Cargo.lock') }}
      - run: cargo test --locked
      - run: cargo build --locked --no-default-features --lib --target thumbv7em-none-eabihf
      - run: cargo run --locked --release --bin fidetype-rs -- conformance
      - run: cargo run --locked --release --bin fidetype-rs -- conformance --vectors ../../spec/conformance/kit

  # Python, TypeScript and Rust must give the same verdict on every golden vector and on the fuzz mutants.
  rust-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Rust stable (minimal profile)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sdk/rust/target
          key: rust-parity-${{ runner.os }}-${{ hashFiles('sdk/rust/Cargo.lock') }}
      - working-directory: sdk/rust
        run: cargo build --locked --release --bin fidetype-rs
      - working-directory: sdk/typescript
        run: |
          npm ci --no-audit --no-fund
          npm run build
          export FIDETYPE_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python"
          export FIDETYPE_RUST_BIN="$GITHUB_WORKSPACE/sdk/rust/target/release/fidetype-rs"
          node scripts/cross-check.mjs
          node scripts/cross-check.mjs --vectors ../../spec/conformance/kit  # P7-01 conformance kit
          for s in 1 2 3; do node scripts/fuzz-parity.mjs --n 30 --seed $s || exit 1; done
      # P7-02: the TypeScript and Rust consumers reach NTS Trust-ready on the kit (verdicts + stream levels via {level}).
      - working-directory: sdk/typescript
        run: |
          "$GITHUB_WORKSPACE/.venv/bin/nts-conform" kit --require-level trust-ready --cmd "node bin/fidetype-ts.mjs consume --profile {profile} --level {level} {path}"
          "$GITHUB_WORKSPACE/.venv/bin/nts-conform" kit --require-level trust-ready --cmd "$GITHUB_WORKSPACE/sdk/rust/target/release/fidetype-rs consume --profile {profile} --level {level} {path}"

  # P2 packaging guard (docs/RELEASING.md section 6): build every SDK package and run the registry
  # dry-run checks on every push, so packaging cannot break silently. Nothing is published.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Python sdist + wheel, twine check
        run: |
          uvx --from build pyproject-build --installer uv --outdir "$RUNNER_TEMP/pydist" .
          uvx twine check --strict "$RUNNER_TEMP"/pydist/*
      - name: Python package contents (no data, tests, caches or models in the wheel; vectors present)
        run: |
          python3 - "$RUNNER_TEMP/pydist" <<'PY'
          import glob, re, sys, tarfile, zipfile
          d = sys.argv[1]
          whl = zipfile.ZipFile(glob.glob(f"{d}/*.whl")[0]).namelist()
          bad = [n for n in whl if re.search(r"(\.(pt|ckpt|npy|fif|edf|bdf|mat|h5|hdf5|pyc)$)|__pycache__|^tests/|/data/raw", n)]
          assert not bad, f"forbidden files in the wheel: {bad[:10]}"
          for need in ["fidetype/py.typed", "fidetype/_spec/conformance/fep-0001/manifest.json",
                       "fidetype/_spec/conformance/v0.1/manifest.json", "fidetype/_spec/conformance/kit/kit.json",
                       "fidetype/_spec/conformance/kit/rule-map.json", "fidetype/_spec/conformance/levels.json",
                       "fidetype/_spec/conformance/certified.json"]:
              assert need in whl, f"missing in the wheel: {need}"
          sd = [m.name.split("/", 1)[1] for m in tarfile.open(glob.glob(f"{d}/*.tar.gz")[0]).getmembers() if "/" in m.name]
          tops = {n.split("/")[0] for n in sd}
          extra = tops - {"src", "tests", "examples", "spec", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff",
                          "pyproject.toml", "PKG-INFO", ".gitignore"}
          assert not extra, f"unexpected top-level entries in the sdist: {sorted(extra)}"
          print(f"wheel {len(whl)} files, sdist {len(sd)} files: OK")
          PY
      - name: Python wheel in a clean venv (outside the checkout)
        run: |
          uv venv "$RUNNER_TEMP/v"
          uv pip install --python "$RUNNER_TEMP/v/bin/python" "$RUNNER_TEMP"/pydist/*.whl
          cd "$RUNNER_TEMP"
          v/bin/fidetype --help
          v/bin/fidetype version
          v/bin/fidetype conformance --profile fep-0001
          v/bin/fidetype conformance consumer
          v/bin/nts-conform kit --require-level trust-ready
          v/bin/nts-conform levels
          v/bin/nts-conform certified --check
          v/bin/fidetype-collector --help
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: npm pack (prepack builds), tarball contents, install in a clean project
        working-directory: sdk/typescript
        run: |
          npm ci --no-audit --no-fund
          npm pack --dry-run
          npm pack --pack-destination "$RUNNER_TEMP"
          tgz=$(ls "$RUNNER_TEMP"/fidetype-sdk-*.tgz)
          tar tzf "$tgz" | tee "$RUNNER_TEMP/npm-files.txt"
          grep -qx 'package/dist/index.js' "$RUNNER_TEMP/npm-files.txt"
          grep -qx 'package/dist/node.d.ts' "$RUNNER_TEMP/npm-files.txt"
          grep -qx 'package/LICENSE' "$RUNNER_TEMP/npm-files.txt"
          if grep -E '^package/(test|scripts|src|spec)/|\.tgz$' "$RUNNER_TEMP/npm-files.txt"; then echo "unexpected files in the npm tarball"; exit 1; fi
          mkdir "$RUNNER_TEMP/tsapp" && cd "$RUNNER_TEMP/tsapp" && npm init -y >/dev/null
          npm install --no-audit --no-fund "$tgz"
          node --input-type=module -e "import * as s from '@fidetype/sdk'; import * as n from '@fidetype/sdk/node'; if (typeof s.NtsWriter !== 'function' || typeof n.runProfileDir !== 'function') process.exit(1); console.log('import OK', s.SDK_VERSION)"
          npx fidetype-ts conformance --profile fep-0001 --vectors "$GITHUB_WORKSPACE/spec/conformance"
      - name: Rust stable (minimal profile)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: cargo package --list, cargo publish --dry-run
        working-directory: sdk/rust
        run: |
          cargo package --list --locked | tee "$RUNNER_TEMP/crate-files.txt"
          if grep -E '^(tests|examples|target)/' "$RUNNER_TEMP/crate-files.txt"; then echo "unexpected files in the crate"; exit 1; fi
          cargo publish --dry-run --locked

  # The Rust crate builds with its declared rust-version (Cargo.toml), std and no_std.
  rust-msrv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - uses: actions/checkout@v7
      - run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          echo "MSRV $msrv"
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" build --locked --lib --bins
          cargo +"$msrv" build --locked --lib --no-default-features

  # R-23 repository hygiene: no caches, build output, data or model files, secrets, private e-mail
  # addresses or files over 5 MB in the tracked tree; no broken relative links in README.md and docs/.
  # Rules and the cleanup checklist: wiki/questions/repo-hygiene.md.
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: node tools/hygiene/check.js --ci
      - run: node tools/hygiene/links.js --ci

  # P3-04: collector pipeline integration test and latency budget (p95 added < 50 ms x FIDETYPE_LATENCY_TOLERANCE,
  # default 1.0; docs/collector.md). The lsl extra makes the LSL receiver test run too. P7-05 / P7-07: the collector's
  # consumer entry point (file / LSL / WebSocket receiver + validate processor) against the conformance kit:
  # NTS Trust-ready for text, intent and control, with both bindings.
  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra lsl
      - run: uv run pytest -q tests/test_collector_pipeline.py tests/test_collector.py tests/test_collector_lsl.py -rs
      - name: Bench report (all profiles; implant-logits is reported, not gated)
        run: uv run python -m fidetype.collector.bench --out "$RUNNER_TEMP/bench" --receiver websocket --receiver file --receiver lsl
      - name: Conformance kit against the collector consumer (P7-05, P7-07)
        run: |
          uv run nts-conform kit --require-level trust-ready --binding nts-lsl/0.1 --binding nts-ws/0.1 \
            --json "$RUNNER_TEMP/collector.kit-report.json" \
            --cmd "$GITHUB_WORKSPACE/.venv/bin/fidetype-collector consume -q --profile {profile} --level {level} {path}"
          # all 36 entries and both bindings, not only the level
          uv run python -c "import json,sys; r=json.load(open(sys.argv[1])); lv=r['level']; sys.exit(0 if r['ok'] and not lv['bindings_missing'] else 1)" "$RUNNER_TEMP/collector.kit-report.json"

  # P2-09: one check that is green only when every job above is green. Make this the required status check
  # (branch rule on main) so that a red platform blocks the merge.
  all-green:
    if: always()
    needs: [pytest, conformance-os, live, live-kt, proto, semconv, typescript, typescript-parity, rust, rust-parity,
            packaging, rust-msrv, hygiene, collector]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        run: |
          echo '${{ toJSON(needs.*.result) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then exit 1; fi
